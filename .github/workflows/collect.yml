name: Collect Ulsan festival/booth postings

on:
  # 2026-10-24: 프로젝트 보류 — 몇 달 뒤 재개 예정. 자동 일일 수집(cron)은 꺼두고,
  # 수동 실행(workflow_dispatch)만 남겨둔다. 재개할 때는 아래 schedule 블록의 주석을
  # 풀면 됨(원래 값: "0 5 * * *" = 14:00 KST daily).
  # schedule:
  #   - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "수집 범위 (all = 전체 지역 그대로, bukgu = 울산 북구 관련 게시판만)"
        type: choice
        options:
          - all
          - bukgu
        default: all

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (pdf-parse — free, no API key)
        run: npm ci

      - name: Install Playwright Chromium (울산 북구·동구·남구청 eminwon 고시공고 목록 발견용)
        run: npx playwright install --with-deps chromium

      - name: Run collector
        env:
          COLLECT_SCOPE: ${{ github.event.inputs.scope == 'bukgu' && 'bukgu' || '' }}
        run: node scripts/collect.js

      - name: Commit updated data (if changed)
        run: |
          git config user.name "festival-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json data/collected.json data/board_status.json
          git diff --cached --quiet || git commit -m "chore: daily collection $(date -u +%Y-%m-%d)"
          git push
