name: Collect Ulsan festival/booth postings

on:
  # 2026-11-03: 자동 일일 수집 재개(요청사항) — 매일 14:00 KST(= 05:00 UTC).
  # GitHub 예약 실행은 서버 사정에 따라 10~30분 이상 늦게 시작될 수 있음.
  # 예약 실행은 울산 게시판만 수집한다(COLLECT_SCOPE=ulsan).
  schedule:
    - cron: "0 5 * * *"
    # 2026-11-09 추가(요청사항): 매일 20:00 KST(= 11:00 UTC) 예약 실행 1회 추가 — 예약 지연·누락과
    # 관공서 간헐적 접속 실패에 대비. 기존 14:00 실행은 그대로 유지.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "수집 범위 (ulsan = 울산 게시판만, bukgu = 울산 북구 관련 게시판만, all = 전체 지역)"
        type: choice
        options:
          - ulsan
          - bukgu
          - all
        default: ulsan
      # 2026-11-09 추가: 관공서 전체 실패 시 자동 재실행용(사람이 수동 실행할 때는 비워 두면 됨).
      retry:
        description: "자동 재실행 여부(자동 설정용 — 수동 실행 시 false 유지)"
        type: string
        default: "false"
      retry_of:
        description: "재실행 원인이 된 원 실행 번호(자동 설정용)"
        type: string
        default: ""
      retry_reason:
        description: "원 실행의 관공서 실패 원인(자동 설정용)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write # 2026-11-09: 관공서 전체 실패 시 자동 재실행(workflow_dispatch) 요청용

# 예약 실행과 수동 실행이 겹쳐 data 커밋이 충돌하지 않게 한 번에 하나만 실행.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (pdf-parse — free, no API key)
        run: npm ci

      - name: Install Playwright Chromium (울산 북구·동구·남구청 eminwon 고시공고 목록 발견용)
        run: npx playwright install --with-deps chromium

      - name: Run collector
        id: collect
        env:
          # 예약 실행(schedule)은 입력값이 없으므로 기본값 ulsan. ("all"은 collect.js가
          # 인식하지 않는 값이라 기존처럼 전체 지역을 수집함)
          COLLECT_SCOPE: ${{ github.event.inputs.scope || 'ulsan' }}
          # 2026-11-09: 자동 재실행일 때만 값이 있음(결과 기록·Summary 표시용)
          COLLECT_RETRY_OF: ${{ github.event.inputs.retry_of }}
          COLLECT_RETRY_REASON: ${{ github.event.inputs.retry_reason }}
        run: node scripts/collect.js

      - name: Commit updated data (if changed)
        run: |
          git config user.name "festival-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json data/collected.json data/board_status.json data/run_history.json
          git diff --cached --quiet || git commit -m "chore: daily collection $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      # 2026-11-09 신설(요청사항): 울산 관공서 6곳이 모두 실패했을 때만 새 서버에서 1회 재실행 요청.
      # 재실행된 실행은 다시 요청하지 않고, 다른 수집 작업이 대기·실행 중이면 생략한다(scripts/retry-on-gov-failure.sh).
      - name: Retry once if all Ulsan government boards failed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GOV_ALL_FAILED: ${{ steps.collect.outputs.gov_all_failed }}
          REASON: ${{ steps.collect.outputs.gov_fail_reason }}
          IS_RETRY: ${{ github.event.inputs.retry || 'false' }}
          SCOPE: ${{ github.event.inputs.scope || 'ulsan' }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/retry-on-gov-failure.sh
