name: Collect Ulsan festival/booth postings

on:
  schedule:
    # 06:00 KST daily = 21:00 UTC the previous day
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run collector
        run: node scripts/collect.js

      - name: Commit updated data (if changed)
        run: |
          git config user.name "festival-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json data/collected.json
          git diff --cached --quiet || git commit -m "chore: daily collection $(date -u +%Y-%m-%d)"
          git push
