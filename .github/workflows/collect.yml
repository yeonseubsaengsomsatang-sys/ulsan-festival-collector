name: Collect Ulsan festival/booth postings

on:
  # 2026-11-03: 자동 일일 수집 재개(요청사항) — 매일 14:00 KST(= 05:00 UTC).
  # GitHub 예약 실행은 서버 사정에 따라 10~30분 이상 늦게 시작될 수 있음.
  # 예약 실행은 울산 게시판만 수집한다(COLLECT_SCOPE=ulsan).
  schedule:
    - cron: "0 5 * * *"
    # 2026-11-09 추가(요청사항): 매일 20:00 KST(= 11:00 UTC) 예약 실행 1회 추가 — 예약 지연·누락과
    # 관공서 간헐적 접속 실패에 대비. 기존 14:00 실행은 그대로 유지.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "수집 범위 (ulsan = 울산 게시판만, bukgu = 울산 북구 관련 게시판만, all = 전체 지역)"
        type: choice
        options:
          - ulsan
          - bukgu
          - all
        default: ulsan
      # 2026-11-09 추가: 관공서 전체 실패 시 자동 재실행용(사람이 수동 실행할 때는 비워 두면 됨).
      retry:
        description: "자동 재실행 여부(자동 설정용 — 수동 실행 시 false 유지)"
        type: string
        default: "false"
      retry_of:
        description: "재실행 원인이 된 원 실행 번호(자동 설정용)"
        type: string
        default: ""
      retry_reason:
        description: "원 실행의 관공서 실패 원인(자동 설정용)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write # 2026-11-09: 관공서 전체 실패 시 자동 재실행(workflow_dispatch) 요청용

# 예약 실행과 수동 실행이 겹쳐 data 커밋이 충돌하지 않게 한 번에 하나만 실행.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (pdf-parse — free, no API key)
        run: npm ci

      # 2026-11-12 수정(요청사항 — 설치 실패로 수집 전체가 멈춘 문제): --with-deps는 매번 Ubuntu
      # 저장소에서 글꼴 9개만 추가로 설치하고 있었음(필요한 시스템 라이브러리는 서버에 이미 있음).
      # 2026-11-11 Ubuntu 저장소 주소 조회 장애로 이 단계가 3회 연속 실패해 수집이 통째로 건너뛰어짐.
      # 수집기는 화면 글자만 읽어 글꼴이 필요 없으므로 헤드리스 브라우저만 설치한다.
      # 설치가 실패해도 일반(HTTP) 기관은 계속 수집하고, 브라우저가 필요한 게시판은 기관별로
      # 실패 기록 + 아래 "브라우저 설치 실패 보고" 단계에서 실행을 실패로 표시한다.
      - name: Install Playwright Chromium (울산 구·군청 eminwon 고시공고 5곳·플리모아 목록 발견용)
        id: playwright
        continue-on-error: true
        run: npx playwright install --only-shell chromium

      - name: Run collector
        id: collect
        env:
          # 예약 실행(schedule)은 입력값이 없으므로 기본값 ulsan. ("all"은 collect.js가
          # 인식하지 않는 값이라 기존처럼 전체 지역을 수집함)
          COLLECT_SCOPE: ${{ github.event.inputs.scope || 'ulsan' }}
          # 2026-11-09: 자동 재실행일 때만 값이 있음(결과 기록·Summary 표시용)
          COLLECT_RETRY_OF: ${{ github.event.inputs.retry_of }}
          COLLECT_RETRY_REASON: ${{ github.event.inputs.retry_reason }}
        # 2026-11-12: 로그를 파일로도 남겨 브라우저 설치 실패 시 게시판별 실패 줄을 요약에 옮긴다.
        shell: bash
        run: node scripts/collect.js 2>&1 | tee collect.log

      - name: Commit updated data (if changed)
        run: |
          git config user.name "festival-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json data/collected.json data/board_status.json data/run_history.json
          git diff --cached --quiet || git commit -m "chore: daily collection $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      # 2026-11-09 신설(요청사항): 울산 관공서 6곳이 모두 실패했을 때만 새 서버에서 1회 재실행 요청.
      # 재실행된 실행은 다시 요청하지 않고, 다른 수집 작업이 대기·실행 중이면 생략한다(scripts/retry-on-gov-failure.sh).
      - name: Retry once if all Ulsan government boards failed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GOV_ALL_FAILED: ${{ steps.collect.outputs.gov_all_failed }}
          REASON: ${{ steps.collect.outputs.gov_fail_reason }}
          IS_RETRY: ${{ github.event.inputs.retry || 'false' }}
          SCOPE: ${{ github.event.inputs.scope || 'ulsan' }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/retry-on-gov-failure.sh

      # 2026-11-12 신설: 브라우저 설치가 실패한 실행은 일반 기관 수집·커밋이 끝난 뒤 실행 전체를
      # "실패"로 표시한다(정상 수집처럼 보이지 않게). 브라우저가 필요한 게시판 6곳과 각 게시판의
      # 실제 실패 줄을 실행 요약(Summary)과 오류 표시에 남긴다.
      - name: Report browser install failure (브라우저 필요 게시판 6곳 실패 표시)
        if: always() && steps.playwright.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## ⚠ 브라우저(Playwright) 설치 실패 — 아래 게시판은 이번 실행에서 수집되지 않음"
            echo "- 북구청·중구청·동구청·남구청·울주군청 고시공고(eminwon) 5곳, 플리모아 외부마켓소식(울산) 1곳"
            echo "- 같은 기관의 다른(일반) 게시판은 정상 수집됐을 수 있음 — 기관 상태가 ok여도 위 게시판은 실패"
            echo ""
            echo "### 게시판별 실패 내역 (수집 로그)"
            if [ -f collect.log ]; then
              grep -E "eminwon|플리모아" collect.log | grep -E "FETCH FAILED|실패" | sed 's/^/- /' || echo "- (로그에서 해당 줄을 찾지 못함 — 수집 단계 로그 확인 필요)"
            else
              echo "- 수집 단계가 실행되지 않음"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=브라우저 설치 실패::eminwon 고시공고 5곳·플리모아 1곳이 이번 실행에서 수집되지 않았습니다(일반 기관은 정상 진행)."
          exit 1
